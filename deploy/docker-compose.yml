# The whole M4 stack: Caddy with the web app in front, the backend behind it.
#   cp deploy/.env.example deploy/.env   # fill in the Blockfrost key and the relayer seed
#   docker compose -f deploy/docker-compose.yml up -d --build
# See docs/m4/self-hosting.md.
services:
  server:
    build: { context: .., dockerfile: deploy/Dockerfile.server }
    env_file: .env
    volumes:
      - analytics:/data
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  analytics:
  caddy_data:
  caddy_config:
